[project]
name = "weather-intelligence-ai"
version = "0.1.0"
description = "Explore weather data and estimate the probability of reaching a daily maximum temperature threshold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "jupyterlab>=4.6.6",
    "pytest>=8.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
